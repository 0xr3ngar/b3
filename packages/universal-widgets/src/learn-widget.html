<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-fb: #09090b;
        --card-fb: #111113;
        --muted-fb: #1c1c1f;
        --fg-fb: #f4f4f5;
        --mf-fb: #a1a1aa;
        --border-fb: #2a2a2e;
        --input-fb: #3f3f46;
        --danger-fb: #fca5a5;
        --danger-bg-fb: rgba(248, 113, 113, 0.14);
        --success-fb: #86efac;
        --warning-fb: #fcd34d;
        --warning-bg-fb: rgba(251, 191, 36, 0.14);
        --info-fb: #93c5fd;
        --line-success: #3ddc84;
        --line-rust: #e08a6d;
        --line-span: #c084fc;
        --line-warning: #fbbf24;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg-fb: #fafafa;
        --card-fb: #ffffff;
        --muted-fb: #f4f4f5;
        --fg-fb: #18181b;
        --mf-fb: #71717a;
        --border-fb: #e4e4e7;
        --input-fb: #d4d4d8;
        --danger-fb: #dc2626;
        --danger-bg-fb: rgba(220, 38, 38, 0.08);
        --success-fb: #15803d;
        --warning-fb: #b45309;
        --warning-bg-fb: rgba(217, 119, 6, 0.12);
        --info-fb: #1d4ed8;
        --line-success: #15803d;
        --line-rust: #c2410c;
        --line-span: #7c3aed;
        --line-warning: #d97706;
      }
      :root {
        --bg: var(--color-background-primary, var(--bg-fb));
        --card: var(--color-background-secondary, var(--card-fb));
        --muted: var(--color-background-tertiary, var(--muted-fb));
        --fg: var(--color-text-primary, var(--fg-fb));
        --mf: var(--color-text-secondary, var(--mf-fb));
        --border: var(--color-border-primary, var(--border-fb));
        --input: var(--color-border-secondary, var(--input-fb));
        --danger: var(--color-text-danger, var(--danger-fb));
        --danger-line: var(--color-border-danger, var(--danger-fb));
        --danger-bg: var(--color-background-danger, var(--danger-bg-fb));
        --success: var(--color-text-success, var(--success-fb));
        --warning: var(--color-text-warning, var(--warning-fb));
        --warning-bg: var(--color-background-warning, var(--warning-bg-fb));
        --info: var(--color-text-info, var(--info-fb));
        --accent: var(--t3-primary, #6366f1);
        --accent-fg: var(--t3-primary-foreground, #fff);
        --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
        --mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace);
        --radius: var(--border-radius-md, 10px);
        --ring: var(--color-ring-primary, var(--t3-primary, #6366f1));
        --line-primary: var(--t3-primary, #6366f1);
        --due: var(--line-warning);
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: transparent;
      }
      body {
        margin: 0;
        padding: 1px;
        color: var(--fg);
        background: transparent;
        font: 14px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        border: 0;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 12px;
        padding: 12px 14px 14px;
      }
      .enter {
        animation: enter 200ms ease;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mf);
        font-size: 12.5px;
        min-height: 20px;
      }
      .progress {
        flex: 1;
        min-width: 72px;
      }
      .progress svg,
      .run svg {
        display: block;
      }
      .count {
        white-space: nowrap;
      }
      .line {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 42%;
        color: var(--fg);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .line i {
        width: 14px;
        height: 4px;
        border-radius: 2px;
        flex: none;
      }
      .stem {
        margin: 12px 0 0;
        font-size: 16.5px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.005em;
      }
      .blank {
        display: inline-block;
        width: 8ch;
        min-width: 6ch;
        max-width: 100%;
        margin: 0 2px;
        padding: 0 2px 1px;
        border: 0;
        border-bottom: 1.5px solid var(--accent);
        border-radius: 0;
        background: transparent;
        font-weight: 500;
      }
      .field,
      .area {
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        box-shadow: 0 0 0 1px var(--input);
        font-size: 16px;
        line-height: 1.45;
      }
      .area {
        display: block;
        min-height: 44px;
        max-height: 140px;
        resize: none;
        overflow: auto;
      }
      .lbl {
        display: block;
        margin-top: 10px;
        color: var(--mf);
        font-size: 12.5px;
      }
      .opts {
        display: grid;
        gap: 6px;
        margin-top: 10px;
      }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-height: 36px;
        padding: 7px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        box-shadow: 0 0 0 1px var(--border);
        text-align: left;
        line-height: 1.35;
      }
      .opt::before {
        content: "";
        width: 14px;
        height: 14px;
        margin-top: 2px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px var(--mf);
        flex: none;
      }
      .opt[aria-checked="true"] {
        box-shadow: 0 0 0 1.5px var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .opt[aria-checked="true"]::before {
        box-shadow: inset 0 0 0 4px var(--accent);
      }
      .opt kbd,
      .grade kbd {
        font: 500 11px var(--mono);
        color: var(--mf);
        flex: none;
      }
      .conf {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        margin-top: 10px;
        padding: 3px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--fg) 6%, transparent);
      }
      .conf button {
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mf);
        font-size: 12.5px;
        font-weight: 500;
      }
      .conf button[aria-checked="true"] {
        background: var(--card);
        color: var(--fg);
        box-shadow:
          0 0 0 1px var(--border),
          0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .actions .primary,
      .actions .next {
        margin-left: auto;
      }
      .end .actions .primary {
        margin-left: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 6px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        box-shadow: 0 0 0 1px var(--border);
        font-size: 13px;
        font-weight: 500;
        text-align: center;
      }
      .btn.primary {
        background: var(--t3-primary, #6366f1);
        color: var(--t3-primary-foreground, #fff);
        box-shadow: none;
      }
      .btn:disabled,
      .opt:disabled,
      .grade:disabled,
      .conf button:disabled {
        opacity: 0.45;
      }
      .quiet {
        border: 0;
        background: none;
        box-shadow: none;
        color: var(--mf);
        font-size: 12.5px;
        text-decoration: underline;
        text-underline-offset: 2px;
        padding: 0;
        min-height: 0;
      }
      .hint,
      .warn,
      .note,
      .err,
      .notice {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12.5px;
        line-height: 1.45;
      }
      .hint {
        background: var(--muted);
      }
      .warn {
        background: var(--warning-bg);
      }
      .note,
      .err {
        background: var(--danger-bg);
      }
      .note b,
      .err {
        color: var(--danger);
      }
      .note b {
        font-weight: 600;
      }
      .notice {
        background: var(--muted);
        color: var(--fg);
      }
      .yours {
        margin: 10px 0 0;
        color: var(--mf);
        font-size: 13px;
      }
      .result {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
      }
      .outcome {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
      }
      .outcome.correct {
        color: var(--success);
      }
      .outcome.partial {
        color: var(--warning);
      }
      .outcome.incorrect {
        color: var(--danger);
      }
      .result p {
        margin: 8px 0 0;
      }
      .answer {
        color: var(--fg);
      }
      .grades {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-top: 12px;
      }
      .grade {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-height: 46px;
        padding: 7px 8px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        box-shadow: 0 0 0 1px var(--border);
        text-align: left;
        font-size: 13px;
        font-weight: 500;
        transition:
          background 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }
      .grade small {
        font-size: 11.5px;
        font-weight: 400;
        color: var(--mf);
      }
      .grade kbd {
        position: absolute;
        right: 7px;
        top: 6px;
      }
      .grade.again:not(.on) {
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--danger-line) 45%, var(--border));
      }
      .grade.again:not(.on) .name {
        color: var(--danger);
      }
      .grade.on {
        background: var(--t3-primary, #6366f1);
        color: var(--t3-primary-foreground, #fff);
        box-shadow: none;
      }
      .grade.on small,
      .grade.on kbd {
        color: color-mix(in srgb, var(--t3-primary-foreground, #fff) 72%, transparent);
      }
      .grade-note {
        margin: 8px 0 0;
        color: var(--mf);
        font-size: 12px;
      }
      .hints {
        margin: 8px 0 0;
        color: var(--mf);
        font-size: 12px;
      }
      .end h1,
      .done h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .sub {
        margin: 2px 0 0;
        color: var(--mf);
        font-size: 13px;
      }
      .run {
        margin-top: 10px;
        overflow-x: auto;
      }
      .diff {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .diff-h {
        padding: 7px 10px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--muted) 80%, transparent);
        font-size: 12.5px;
        font-weight: 500;
      }
      .diff-row {
        display: grid;
        grid-template-columns: 22px 1fr;
        padding: 3px 10px 3px 0;
        font: 12.5px/1.45 var(--mono);
      }
      .diff-row b {
        text-align: center;
        font-weight: 600;
      }
      .diff-row span {
        min-width: 0;
      }
      .diff-row em {
        display: block;
        color: var(--mf);
        font-family: var(--font);
        font-style: normal;
        font-size: 11.5px;
      }
      .diff-row.learned {
        background: color-mix(in srgb, var(--success) 12%, transparent);
      }
      .diff-row.learned b {
        color: var(--success);
      }
      .diff-row.stronger b {
        color: var(--info);
      }
      .diff-row.fixed {
        background: color-mix(in srgb, var(--danger) 10%, transparent);
      }
      .diff-row.fixed b {
        color: var(--danger);
      }
      .diff-row.weaker b {
        color: var(--warning);
      }
      .sched {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 6px 12px;
        margin: 12px 0 0;
        font-size: 13px;
      }
      .sched dt {
        color: var(--mf);
      }
      .sched dd {
        margin: 0;
      }
      .unlocked {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 13px;
      }
      .unlocked b {
        font-weight: 600;
      }
      svg .lbl {
        font: 500 10px var(--font);
        fill: var(--fg);
      }
      svg .sub {
        font: 500 9px var(--font);
        fill: var(--mf);
      }
      .wait {
        color: var(--mf);
      }
      @media (max-width: 420px) {
        .card {
          padding: 12px;
        }
        .stem {
          font-size: 16px;
        }
        .line {
          max-width: 34%;
        }
        .grade {
          align-items: center;
          padding: 6px 4px;
          text-align: center;
          font-size: 12.5px;
        }
        .grade kbd {
          display: none;
        }
        .sched {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .sched dd {
          margin-bottom: 6px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .enter {
          animation: none;
        }
        .grade {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" role="region" aria-label="Learn card">
      <div class="card wait">Waiting for the card…</div>
    </div>
    <div id="live" class="sr" aria-live="polite"></div>
    <script>
      (function () {
        var PROTOCOL = "2026-01-26";
        var RATINGS = ["again", "hard", "good", "easy"];
        var RATING_LABEL = { again: "Again", hard: "Hard", good: "Good", easy: "Easy" };
        var CONF = [
          { id: "low", label: "Guessing" },
          { id: "medium", label: "Unsure" },
          { id: "high", label: "Sure" },
        ];
        var DIFF = { learned: "+", stronger: "↑", fixed: "−", weaker: "↓" };

        var payload = null;
        var states = [];
        var position = 0;
        var finished = false;
        var draft = { text: "", choice: null, confidence: null };
        var busy = false;
        var errorText = null;
        var lastRetry = null;
        var notice = null;
        var doneAction = null;
        var answerBlurred = false;
        var rpcId = 0;
        var pending = new Map();
        var appliedVars = [];
        var lastW = -1;
        var lastH = -1;
        var lastLive = "";
        var sizeQueued = false;

        function post(message) {
          if (window.parent !== window) window.parent.postMessage(message, "*");
        }

        function request(method, params) {
          var id = ++rpcId;
          return new Promise(function (resolve, reject) {
            pending.set(id, { resolve: resolve, reject: reject });
            post({ jsonrpc: "2.0", id: id, method: method, params: params });
          });
        }

        function notify(method, params) {
          post({ jsonrpc: "2.0", method: method, params: params });
        }

        function textOf(result) {
          var block = result && Array.isArray(result.content) ? result.content[0] : null;
          if (block && block.type === "text" && typeof block.text === "string") return block.text;
          return "";
        }

        function unwrapTool(result) {
          if (!result || typeof result !== "object") throw new Error("Empty tool result.");
          if (result.isError === true) throw new Error(textOf(result) || "Something went wrong.");
          if (result.structuredContent && typeof result.structuredContent === "object") {
            return result.structuredContent;
          }
          var text = textOf(result);
          if (text) {
            try {
              var parsed = JSON.parse(text);
              if (parsed && typeof parsed === "object") return parsed;
            } catch (e) {
              return { text: text };
            }
          }
          throw new Error("Tool result had no content.");
        }

        function callTool(name, args) {
          return request("tools/call", { name: name, arguments: args }).then(unwrapTool);
        }

        function esc(value) {
          return String(value).replace(/[&<>"']/g, function (ch) {
            if (ch === "&") return "&amp;";
            if (ch === "<") return "&lt;";
            if (ch === ">") return "&gt;";
            if (ch === '"') return "&quot;";
            return "&#39;";
          });
        }

        function add(parent, child) {
          if (child != null && child !== false) parent.append(child);
        }

        function h(tag, props) {
          var node = document.createElement(tag);
          if (props) {
            Object.keys(props).forEach(function (key) {
              var value = props[key];
              if (value == null || value === false) return;
              if (key === "class") node.className = value;
              else if (key === "text") node.textContent = String(value);
              else if (key.indexOf("on") === 0 && typeof value === "function") {
                node.addEventListener(key.slice(2).toLowerCase(), value);
              } else node.setAttribute(key, value === true ? "" : String(value));
            });
          }
          for (var i = 2; i < arguments.length; i++) {
            var child = arguments[i];
            if (child == null || child === false) continue;
            node.append(child.nodeType ? child : document.createTextNode(String(child)));
          }
          return node;
        }

        function svgNode(markup) {
          var holder = document.createElement("div");
          holder.innerHTML = markup.trim();
          return holder.firstElementChild;
        }

        function lineColor(line) {
          var color = line && line.color;
          if (color === "success") return "var(--line-success)";
          if (color === "rust") return "var(--line-rust)";
          if (color === "span") return "var(--line-span)";
          if (color === "warning") return "var(--line-warning)";
          if (color === "primary" || color == null || color === "") return "var(--line-primary)";
          if (
            typeof color === "string" &&
            /^#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color)
          ) {
            return color;
          }
          if (typeof color === "string" && /^[a-z]{1,24}$/i.test(color)) return color;
          return "var(--line-primary)";
        }

        function pie(x, y, r, color) {
          var f = 0.55;
          var a = -Math.PI / 2 + f * 2 * Math.PI;
          var ex = (x + r * Math.cos(a)).toFixed(2);
          var ey = (y + r * Math.sin(a)).toFixed(2);
          return (
            '<path d="M' +
            x +
            "," +
            y +
            " L" +
            x +
            "," +
            (y - r).toFixed(2) +
            " A" +
            r +
            "," +
            r +
            " 0 1 1 " +
            ex +
            "," +
            ey +
            ' Z" fill="' +
            color +
            '"/>'
          );
        }

        function glyph(state, x, y, color, k, selected, title) {
          var R = 6.5 * k;
          var body = title ? "<title>" + esc(title) + "</title>" : "";
          if (selected) {
            body +=
              '<circle cx="' +
              x +
              '" cy="' +
              y +
              '" r="' +
              (R + 5.5 * k).toFixed(2) +
              '" fill="none" stroke="var(--fg)" stroke-width="' +
              (1.5 * k).toFixed(2) +
              '"/>';
          }
          if (state === "solid") {
            body +=
              '<circle cx="' +
              x +
              '" cy="' +
              y +
              '" r="' +
              R.toFixed(2) +
              '" fill="' +
              color +
              '" stroke="var(--card)" stroke-width="' +
              (2.2 * k).toFixed(2) +
              '"/>';
          } else if (state === "learning") {
            body +=
              '<circle cx="' +
              x +
              '" cy="' +
              y +
              '" r="' +
              R.toFixed(2) +
              '" fill="var(--card)" stroke="' +
              color +
              '" stroke-width="' +
              (2.2 * k).toFixed(2) +
              '"/>' +
              pie(x, y, R - 2 * k, color);
          } else if (state === "due") {
            var d = R + 1.6 * k;
            body +=
              '<path d="M' +
              x +
              "," +
              (y - d).toFixed(2) +
              " L" +
              (x + d).toFixed(2) +
              "," +
              y +
              " L" +
              x +
              "," +
              (y + d).toFixed(2) +
              " L" +
              (x - d).toFixed(2) +
              "," +
              y +
              ' Z" fill="var(--due)" stroke="var(--card)" stroke-width="' +
              (2 * k).toFixed(2) +
              '" stroke-linejoin="round"/>';
          } else {
            body +=
              '<circle cx="' +
              x +
              '" cy="' +
              y +
              '" r="' +
              R.toFixed(2) +
              '" fill="var(--card)" stroke="' +
              color +
              '" stroke-width="' +
              (2 * k).toFixed(2) +
              '" stroke-dasharray="' +
              (2.4 * k).toFixed(2) +
              " " +
              (1.8 * k).toFixed(2) +
              '"/>';
          }
          return "<g>" + body + "</g>";
        }

        function progressSvg(cards, index, done) {
          var n = cards.length;
          if (!n) return "";
          var k = n > 18 ? 0.36 : n > 12 ? 0.46 : 0.58;
          var y = 10;
          var pad = 9;
          var w = 240;
          function xAt(i) {
            return n === 1 ? w / 2 : pad + (i * (w - pad * 2)) / (n - 1);
          }
          var tracks = "";
          for (var i = 0; i < n - 1; i++) {
            var dim = !done && i >= index ? ' opacity="0.28"' : "";
            tracks +=
              '<path d="M' +
              xAt(i).toFixed(1) +
              "," +
              y +
              " H" +
              xAt(i + 1).toFixed(1) +
              '" fill="none" stroke="' +
              lineColor(cards[i].line) +
              '" stroke-width="' +
              (3.4 * k).toFixed(2) +
              '" stroke-linecap="round"' +
              dim +
              "/>";
          }
          var dots = "";
          for (var j = 0; j < n; j++) {
            var state = done || j < index ? "solid" : j === index ? "learning" : "ready";
            dots += glyph(
              state,
              xAt(j),
              y,
              lineColor(cards[j].line),
              k,
              !done && j === index,
              cards[j].conceptTitle,
            );
          }
          return (
            '<svg viewBox="0 0 ' +
            w +
            ' 20" width="100%" height="20" aria-hidden="true">' +
            tracks +
            dots +
            "</svg>"
          );
        }

        function shorten(value, max) {
          var text = String(value || "");
          return text.length <= max ? text : text.slice(0, max - 1) + "…";
        }

        function runSvg(stops) {
          var n = stops.length;
          if (!n) return "";
          var gap = n > 10 ? 48 : 56;
          var pad = 28;
          var y = 18;
          var w = pad * 2 + Math.max(0, n - 1) * gap;
          var h = 78;
          var tracks = "";
          for (var i = 0; i < n - 1; i++) {
            var x1 = pad + i * gap;
            var x2 = pad + (i + 1) * gap;
            tracks +=
              '<path d="M' +
              x1 +
              "," +
              y +
              " H" +
              x2 +
              '" fill="none" stroke="' +
              lineColor(stops[i].line) +
              '" stroke-width="5" stroke-linecap="round"/>';
          }
          var marks = "";
          for (var j = 0; j < n; j++) {
            var stop = stops[j];
            var x = pad + j * gap;
            marks += glyph(
              stop.state || "ready",
              x,
              y,
              lineColor(stop.line),
              0.82,
              false,
              stop.conceptTitle,
            );
            if (stop.state === "due" || stop.note) {
              var sub = stop.note || (stop.state === "due" ? "Again tomorrow" : "");
              marks +=
                '<text class="lbl" x="' +
                x +
                '" y="' +
                (y + 22) +
                '" text-anchor="middle">' +
                esc(shorten(stop.conceptTitle, 14)) +
                "</text>";
              if (sub) {
                marks +=
                  '<text class="sub" x="' +
                  x +
                  '" y="' +
                  (y + 34) +
                  '" text-anchor="middle">' +
                  esc(shorten(sub, 18)) +
                  "</text>";
              }
            }
          }
          var names = stops
            .map(function (stop) {
              return stop.conceptTitle;
            })
            .join(", ");
          return (
            '<svg viewBox="0 0 ' +
            w +
            " " +
            h +
            '" width="' +
            w +
            '" height="' +
            h +
            '" role="img" aria-label="Stops: ' +
            esc(names) +
            '">' +
            tracks +
            marks +
            "</svg>"
          );
        }

        function cardIndex() {
          return payload && payload.widget === "review" ? position : 0;
        }

        function currentCard() {
          if (!payload) return null;
          if (payload.widget === "check") return payload.card || null;
          if (payload.widget === "review") return (payload.cards || [])[position] || null;
          return null;
        }

        function currentState() {
          var state = states[cardIndex()];
          return state && typeof state === "object" ? state : { status: "open", help: "none" };
        }

        function syncDraft() {
          var state = currentState();
          var answer = state.answer || {};
          answerBlurred = false;
          draft = {
            text: typeof answer.text === "string" ? answer.text : "",
            choice: typeof answer.choice === "number" ? answer.choice : null,
            confidence:
              state.confidence === "low" ||
              state.confidence === "medium" ||
              state.confidence === "high"
                ? state.confidence
                : null,
          };
        }

        function answerReady(card) {
          if (!card || busy) return false;
          if (card.kind === "choice") return typeof draft.choice === "number";
          return draft.text.trim() !== "";
        }

        function canSubmit(card) {
          return (
            answerReady(card) &&
            (draft.confidence === "low" ||
              draft.confidence === "medium" ||
              draft.confidence === "high")
          );
        }

        function invoke(name, args, apply) {
          var exec = function () {
            busy = true;
            errorText = null;
            render();
            callTool(name, args).then(
              function (data) {
                busy = false;
                apply(data);
                if (errorText) lastRetry = exec;
                else lastRetry = null;
                render();
              },
              function (err) {
                busy = false;
                errorText = (err && err.message) || "Request failed.";
                lastRetry = exec;
                render();
              },
            );
          };
          exec();
        }

        function submit() {
          var card = currentCard();
          var state = currentState();
          if (!payload || !card || state.status === "graded" || !canSubmit(card)) return;
          var index = cardIndex();
          var answer = card.kind === "choice" ? { choice: draft.choice } : { text: draft.text };
          invoke(
            "learn_widget_answer",
            {
              itemId: payload.itemId,
              cardIndex: index,
              answer: answer,
              confidence: draft.confidence,
              help: state.help === "hint" ? "hint" : "none",
            },
            function (next) {
              states[index] = next;
            },
          );
        }

        function askHint() {
          var card = currentCard();
          var state = currentState();
          if (!payload || !card || !card.hintAvailable || state.status === "graded" || busy) return;
          var index = cardIndex();
          invoke(
            "learn_widget_hint",
            { itemId: payload.itemId, cardIndex: index },
            function (data) {
              var prev =
                states[index] && typeof states[index] === "object"
                  ? states[index]
                  : { status: "open", help: "none" };
              var hint = data && typeof data.hint === "string" ? data.hint : "";
              states[index] = {
                status: prev.status || "open",
                help: "hint",
                hint: hint,
                answer: prev.answer,
                confidence: prev.confidence,
                result: prev.result,
              };
            },
          );
        }

        function reveal() {
          if (!payload || currentState().status === "graded" || busy) return;
          var index = cardIndex();
          invoke(
            "learn_widget_reveal",
            { itemId: payload.itemId, cardIndex: index },
            function (next) {
              states[index] = next;
            },
          );
        }

        function override(rating) {
          var state = currentState();
          if (!payload || !state.result || state.result.rating === rating || busy) return;
          var index = cardIndex();
          invoke(
            "learn_widget_override",
            { itemId: payload.itemId, cardIndex: index, rating: rating },
            function (next) {
              states[index] = next;
            },
          );
        }

        function nextCard() {
          if (!payload || payload.widget !== "review" || finished) return;
          var cards = payload.cards || [];
          if (position >= cards.length - 1) {
            finished = true;
            render();
            return;
          }
          position += 1;
          syncDraft();
          render();
        }

        function act(action, conceptId) {
          if (!payload || busy) return;
          var args = { itemId: payload.itemId, action: action };
          if (conceptId) args.conceptId = conceptId;
          invoke("learn_widget_action", args, function (data) {
            if (!data || data.ok === false) {
              errorText = (data && data.message) || "That did not work.";
              return;
            }
            doneAction = action;
            notice = data.message || (action === "snooze" ? "Snoozed." : "Started.");
          });
        }

        function remembered() {
          var cards = (payload && payload.cards) || [];
          var count = 0;
          for (var i = 0; i < cards.length; i++) {
            var result = states[i] && states[i].result;
            if (result && result.rating && result.rating !== "again") count += 1;
          }
          return count;
        }

        function chip(card) {
          var name = card.conceptTitle || (card.line && card.line.name) || "Concept";
          var swatch = h("i");
          swatch.style.background = lineColor(card.line);
          return h("span", { class: "line", title: name }, swatch, name);
        }

        function errorBox() {
          if (!errorText) return null;
          return h(
            "div",
            { class: "err", role: "alert" },
            h("span", { text: errorText }),
            lastRetry
              ? h("button", {
                  class: "quiet",
                  type: "button",
                  "data-k": "retry",
                  onClick: function () {
                    lastRetry();
                  },
                  text: "Retry",
                })
              : null,
          );
        }

        function answerControl(card, open) {
          if (!open) return null;
          if (card.kind === "choice") {
            var options = card.options || [];
            var group = h("div", { class: "opts", role: "radiogroup", "aria-label": "Answer" });
            options.forEach(function (option, index) {
              group.append(
                h(
                  "button",
                  {
                    class: "opt",
                    type: "button",
                    role: "radio",
                    "aria-checked": draft.choice === index ? "true" : "false",
                    "data-k": "opt-" + index,
                    disabled: busy,
                    onClick: function () {
                      draft.choice = index;
                      render();
                    },
                  },
                  index < 9 ? h("kbd", { text: String(index + 1) }) : null,
                  h("span", { text: option }),
                ),
              );
            });
            return group;
          }
          if (
            card.kind === "cloze" &&
            card.stem.indexOf("____") !== -1 &&
            card.stem.split("____").length === 2
          ) {
            return null;
          }
          if (card.kind === "cloze") {
            return h(
              "label",
              { class: "lbl", text: "Fill the blank" },
              h("input", {
                class: "field",
                type: "text",
                "data-k": "answer",
                autocomplete: "off",
                value: draft.text,
                disabled: busy,
                onInput: onText,
              }),
            );
          }
          var area = h("textarea", {
            class: "area",
            "data-k": "answer",
            rows: "2",
            disabled: busy,
            onInput: onArea,
          });
          area.value = draft.text;
          area.setAttribute("aria-label", card.kind === "recall" ? "Recall" : "Answer");
          requestAnimationFrame(function () {
            grow(area);
          });
          return h(
            "label",
            { class: "lbl", text: card.kind === "recall" ? "Recall" : "Answer" },
            area,
          );
        }

        function onText(event) {
          draft.text = event.target.value;
          if (event.target.classList.contains("blank")) sizeBlank(event.target);
          var button = document.querySelector("[data-k=submit]");
          var card = currentCard();
          if (button && card) button.disabled = !canSubmit(card);
        }

        function onArea(event) {
          draft.text = event.target.value;
          grow(event.target);
          var button = document.querySelector("[data-k=submit]");
          var card = currentCard();
          if (button && card) button.disabled = !canSubmit(card);
        }

        function grow(area) {
          area.style.height = "auto";
          area.style.height = area.scrollHeight + "px";
        }

        function sizeBlank(input) {
          var chars = Math.max(6, Math.min(28, input.value.length + 1));
          input.style.width = chars + "ch";
        }

        function stemNode(card, open) {
          var parts = card.kind === "cloze" ? String(card.stem || "").split("____") : null;
          if (open && parts && parts.length === 2) {
            var input = h("input", {
              class: "blank",
              type: "text",
              "data-k": "answer",
              "aria-label": "Missing word",
              autocomplete: "off",
              value: draft.text,
              disabled: busy,
              onInput: onText,
            });
            sizeBlank(input);
            return h("p", { class: "stem" }, parts[0], input, parts[1]);
          }
          return h("p", { class: "stem", text: card.stem || "" });
        }

        function yours(card, state) {
          var answer = state.answer || {};
          var text = typeof answer.text === "string" ? answer.text.trim() : "";
          if (!text && typeof answer.choice === "number" && card.options)
            text = card.options[answer.choice] || "";
          if (!text) return null;
          return h("p", { class: "yours", text: "You answered: " + text });
        }

        function resultBlock(card, state) {
          var result = state.result;
          if (!result) return null;
          var block = h("div", { class: "result" });
          var outcome =
            result.outcome === "correct" ||
            result.outcome === "partial" ||
            result.outcome === "incorrect"
              ? result.outcome
              : "partial";
          var label =
            outcome === "correct" ? "Correct" : outcome === "partial" ? "Partial" : "Incorrect";
          block.append(h("p", { class: "outcome " + outcome, text: label }));
          if (result.feedback) block.append(h("p", { text: result.feedback }));
          if (result.explanation) block.append(h("p", { text: result.explanation }));
          if (result.correctAnswer) {
            block.append(
              h("p", { class: "answer" }, h("b", { text: "Answer. " }), result.correctAnswer),
            );
          }
          if (result.hypercorrection) {
            var mix =
              card.misconceptionWarning || "You were sure, and this answer missed the mark.";
            block.append(
              h(
                "div",
                { class: "note" },
                h("span", {}, h("b", { text: "Watch this mix-up. " }), mix),
              ),
            );
          }
          var grades = h("div", { class: "grades", role: "group", "aria-label": "Grade" });
          RATINGS.forEach(function (rating, index) {
            var on = result.rating === rating;
            grades.append(
              h(
                "button",
                {
                  class: "grade" + (rating === "again" ? " again" : "") + (on ? " on" : ""),
                  type: "button",
                  "data-k": "grade-" + rating,
                  "aria-pressed": on ? "true" : "false",
                  disabled: busy,
                  onClick: function () {
                    override(rating);
                  },
                },
                h("span", { class: "name", text: RATING_LABEL[rating] }),
                h("small", { text: (result.intervals && result.intervals[rating]) || "" }),
                h("kbd", { text: String(index + 1) }),
              ),
            );
          });
          block.append(grades);
          block.append(
            h("p", {
              class: "grade-note",
              text: "Graded from your answer and confidence. Tap to change.",
            }),
          );
          return block;
        }

        function cardView() {
          var card = currentCard();
          var state = currentState();
          if (!card) return h("div", { class: "card", text: "This card is missing." });
          var open = state.status !== "graded";
          var root = h("div", { class: "card enter" });
          var head = h("div", { class: "head" });
          if (payload.widget === "review") {
            var cards = payload.cards || [];
            var progress = h("div", { class: "progress" });
            var graphic = svgNode(progressSvg(cards, position, false));
            if (graphic) progress.append(graphic);
            head.append(progress);
            head.append(
              h("span", { class: "count", text: "Card " + (position + 1) + " of " + cards.length }),
            );
          }
          head.append(chip(card));
          if (payload.widget === "check") {
            head.append(h("span", { class: "count", text: "Card 1 of 1" }));
          }
          root.append(head);
          root.append(stemNode(card, open));
          add(root, answerControl(card, open));
          if (open && card.misconceptionWarning) {
            root.append(h("div", { class: "warn", text: card.misconceptionWarning }));
          }
          if (open && state.help === "hint" && state.hint) {
            root.append(h("div", { class: "hint", text: state.hint }));
          }
          if (open) {
            var conf = h("div", { class: "conf", role: "radiogroup", "aria-label": "Confidence" });
            CONF.forEach(function (item) {
              conf.append(
                h("button", {
                  type: "button",
                  role: "radio",
                  "aria-checked": draft.confidence === item.id ? "true" : "false",
                  "data-k": "conf-" + item.id,
                  disabled: busy,
                  onClick: function () {
                    draft.confidence = item.id;
                    render();
                  },
                  text: item.label,
                }),
              );
            });
            root.append(h("div", { class: "lbl", text: "How sure are you?" }));
            root.append(conf);
            var actions = h("div", { class: "actions" });
            if (card.hintAvailable && state.help !== "hint") {
              actions.append(
                h("button", {
                  class: "btn",
                  type: "button",
                  "data-k": "hint",
                  disabled: busy,
                  onClick: askHint,
                  text: "Hint",
                }),
              );
            }
            actions.append(
              h("button", {
                class: "quiet",
                type: "button",
                "data-k": "reveal",
                disabled: busy,
                onClick: reveal,
                text: "Show answer",
              }),
            );
            actions.append(
              h("button", {
                class: "btn primary",
                type: "button",
                "data-k": "submit",
                disabled: !canSubmit(card),
                onClick: submit,
                text: "Submit",
              }),
            );
            root.append(actions);
            root.append(
              h("p", { class: "hints", text: "Enter submits. Alt+1 to 3 sets confidence." }),
            );
          } else {
            add(root, yours(card, state));
            add(root, resultBlock(card, state));
            if (payload.widget === "review") {
              root.append(
                h(
                  "div",
                  { class: "actions" },
                  h("button", {
                    class: "btn primary next",
                    type: "button",
                    "data-k": "next",
                    disabled: busy,
                    onClick: nextCard,
                    text: "Next card",
                  }),
                ),
              );
              root.append(
                h("p", {
                  class: "hints",
                  text: "Space shows the next card. 1 to 4 changes the grade.",
                }),
              );
            } else {
              root.append(h("p", { class: "hints", text: "1 to 4 changes the grade." }));
            }
          }
          add(root, errorBox());
          return root;
        }

        function doneView() {
          var cards = (payload && payload.cards) || [];
          var count = remembered();
          var root = h("div", { class: "card done enter" });
          var progress = h("div", { class: "progress" });
          var graphic = svgNode(progressSvg(cards, cards.length - 1, true));
          if (graphic) progress.append(graphic);
          root.append(
            h(
              "div",
              { class: "head" },
              progress,
              h("span", { class: "count", text: "Card " + cards.length + " of " + cards.length }),
            ),
          );
          root.append(h("h1", { text: "Review done, " + count + " remembered" }));
          add(root, errorBox());
          return root;
        }

        function sessionView(summary) {
          var root = h("div", { class: "card end enter" });
          if (!summary) {
            root.append(h("p", { text: "This session has no summary." }));
            add(root, errorBox());
            return root;
          }
          var counts = summary.counts || {};
          root.append(h("h1", { text: summary.title || "Review done" }));
          root.append(
            h("p", {
              class: "sub",
              text:
                (counts.remembered || 0) +
                " remembered, " +
                (counts.again || 0) +
                " again · " +
                (typeof summary.minutes === "number" ? summary.minutes : 0) +
                " min",
            }),
          );
          var stops = summary.stops || [];
          if (stops.length) {
            var run = h("div", { class: "run" });
            var graphic = svgNode(runSvg(stops));
            if (graphic) run.append(graphic);
            root.append(run);
          }
          var diff = summary.diff || [];
          if (diff.length) {
            var box = h("div", { class: "diff" });
            box.append(h("div", { class: "diff-h", text: "Understanding" }));
            diff.forEach(function (row) {
              var mark = DIFF[row.kind];
              if (!mark) return;
              var text = h("span", {}, row.conceptTitle || "");
              if (row.detail) text.append(h("em", { text: row.detail }));
              box.append(h("div", { class: "diff-row " + row.kind }, h("b", { text: mark }), text));
            });
            root.append(box);
          }
          var schedule = summary.schedule || [];
          if (schedule.length) {
            var list = h("dl", { class: "sched" });
            schedule.forEach(function (row) {
              list.append(h("dt", { text: row.when || "" }));
              list.append(h("dd", { text: (row.concepts || []).join(", ") }));
            });
            root.append(list);
          }
          if (summary.unlocked && summary.unlocked.conceptTitle) {
            root.append(
              h(
                "div",
                { class: "unlocked" },
                svgNode(
                  '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">' +
                    glyph("ready", 8, 8, lineColor(null), 0.72, false) +
                    "</svg>",
                ),
                h(
                  "span",
                  {},
                  h("b", { text: summary.unlocked.conceptTitle }),
                  " is ready to learn.",
                ),
              ),
            );
          }
          var actions = h("div", { class: "actions" });
          if (summary.next && summary.next.conceptTitle) {
            actions.append(
              h("button", {
                class: "btn primary",
                type: "button",
                disabled: busy || doneAction === "start_concept",
                onClick: function () {
                  act("start_concept", summary.next.conceptId);
                },
                text: "Learn " + summary.next.conceptTitle,
              }),
            );
          }
          if (summary.snoozeUntil) {
            actions.append(
              h("button", {
                class: "btn",
                type: "button",
                disabled: busy || doneAction === "snooze",
                onClick: function () {
                  act("snooze");
                },
                text: "Snooze until " + summary.snoozeUntil,
              }),
            );
          }
          if (actions.childNodes.length) root.append(actions);
          if (notice) root.append(h("div", { class: "notice", text: notice }));
          add(root, errorBox());
          return root;
        }

        function announcement() {
          if (errorText) return errorText;
          if (notice) return notice;
          if (finished && payload && payload.widget === "review") {
            return "Review done, " + remembered() + " remembered";
          }
          var state = currentState();
          if (state.status === "graded" && state.result) {
            var outcome = state.result.outcome || "graded";
            return outcome + ". " + (state.result.feedback || "");
          }
          if (state.help === "hint" && state.hint) return "Hint. " + state.hint;
          return "";
        }

        function captureFocus() {
          var el = document.activeElement;
          if (!el || !el.getAttribute) return null;
          var key = el.getAttribute("data-k");
          if (!key) return null;
          return { key: key, start: el.selectionStart, end: el.selectionEnd };
        }

        function restoreFocus(saved) {
          if (!saved) return;
          var safe = window.CSS && CSS.escape ? CSS.escape(saved.key) : saved.key.replace(/"/g, "");
          var el = document.querySelector('[data-k="' + safe + '"]');
          if (!el || !el.focus) return;
          el.focus();
          if (typeof saved.start === "number" && el.setSelectionRange) {
            try {
              el.setSelectionRange(saved.start, saved.end);
            } catch (e) {
              /* caret may not apply */
            }
          }
        }

        function render() {
          var saved = captureFocus();
          var node = !payload
            ? h("div", { class: "card wait", text: "Waiting for the card…" })
            : payload.widget === "session-end"
              ? sessionView(payload.summary)
              : payload.widget === "review" && finished
                ? doneView()
                : cardView();
          document.getElementById("app").replaceChildren(node);
          restoreFocus(saved);
          var text = announcement();
          var live = document.getElementById("live");
          if (live && text !== lastLive) {
            lastLive = text;
            live.textContent = text;
          }
          reportSoon();
        }

        function isField(target) {
          if (!target || !target.tagName) return false;
          var tag = target.tagName;
          return tag === "INPUT" || tag === "TEXTAREA" || target.isContentEditable;
        }

        function inChoices(target) {
          return !!(target && target.closest && target.closest(".opts"));
        }

        document.addEventListener("focusout", function (event) {
          var from = event.target;
          if (!from || !from.closest || !from.closest(".opts, .blank, .field, .area")) return;
          var next = event.relatedTarget;
          if (next && next.closest && next.closest(".opts, .blank, .field, .area")) return;
          answerBlurred = true;
        });

        document.addEventListener("keydown", function (event) {
          if (event.metaKey || event.ctrlKey || event.isComposing) return;
          var card = currentCard();
          var state = currentState();
          var graded = state.status === "graded";
          if (event.altKey && (event.key === "1" || event.key === "2" || event.key === "3")) {
            if (!card || graded) return;
            event.preventDefault();
            draft.confidence = CONF[Number(event.key) - 1].id;
            render();
            return;
          }
          if (event.key === "Enter" && !event.shiftKey && card && !graded) {
            if (event.target && event.target.tagName === "BUTTON") return;
            event.preventDefault();
            if (canSubmit(card)) submit();
            return;
          }
          if (
            event.key === " " &&
            payload &&
            payload.widget === "review" &&
            graded &&
            !finished &&
            !isField(event.target)
          ) {
            if (event.target && event.target.tagName === "BUTTON") return;
            event.preventDefault();
            nextCard();
            return;
          }
          if (!card || busy) return;
          if (
            !graded &&
            !answerBlurred &&
            card.kind === "choice" &&
            !isField(event.target) &&
            /^[1-9]$/.test(event.key)
          ) {
            var index = Number(event.key) - 1;
            if (card.options && index < card.options.length) {
              event.preventDefault();
              draft.choice = index;
              render();
            }
            return;
          }
          if (
            !graded &&
            answerBlurred &&
            !isField(event.target) &&
            !inChoices(event.target) &&
            /^[1-3]$/.test(event.key)
          ) {
            event.preventDefault();
            draft.confidence = CONF[Number(event.key) - 1].id;
            render();
            return;
          }
          if (graded && !isField(event.target) && /^[1-4]$/.test(event.key)) {
            event.preventDefault();
            override(RATINGS[Number(event.key) - 1]);
          }
        });

        function applyVariables(variables) {
          var root = document.documentElement;
          var next = [];
          var seen = {};
          var source = variables && typeof variables === "object" ? variables : {};
          Object.keys(source).forEach(function (key) {
            if (!/^--[a-zA-Z0-9-]+$/.test(key)) return;
            root.style.setProperty(key, String(source[key]).replace(/[;{}<>]/g, ""));
            seen[key] = true;
            next.push(key);
          });
          appliedVars.forEach(function (key) {
            if (!seen[key]) root.style.removeProperty(key);
          });
          appliedVars = next;
        }

        function applyContext(partial) {
          if (!partial || typeof partial !== "object") return;
          if (partial.theme === "light" || partial.theme === "dark") {
            document.documentElement.dataset.theme = partial.theme;
          }
          if (partial.styles && typeof partial.styles === "object")
            applyVariables(partial.styles.variables || {});
          if (partial.containerDimensions && typeof partial.containerDimensions === "object") {
            var box = partial.containerDimensions;
            var cap =
              typeof box.height === "number"
                ? box.height
                : typeof box.maxHeight === "number"
                  ? box.maxHeight
                  : 0;
            var root = document.documentElement;
            if (cap > 0) {
              root.style.maxHeight = Math.round(cap) + "px";
              root.style.overflow = "auto";
            } else {
              root.style.removeProperty("max-height");
              root.style.removeProperty("overflow");
            }
          }
          reportSoon();
        }

        function capLimit() {
          var raw = parseFloat(document.documentElement.style.maxHeight);
          return Number.isFinite(raw) && raw > 0 ? raw : Infinity;
        }

        function reportSize() {
          var root = document.documentElement;
          var content = Math.ceil(
            Math.max(root.scrollHeight, document.body ? document.body.scrollHeight : 0),
          );
          var height = Math.max(32, Math.min(content, capLimit()));
          var width = Math.ceil(root.clientWidth || 0);
          if (height === lastH && width === lastW) return;
          lastH = height;
          lastW = width;
          notify("ui/notifications/size-changed", { width: width, height: height });
        }

        function reportSoon() {
          if (sizeQueued) return;
          sizeQueued = true;
          requestAnimationFrame(function () {
            sizeQueued = false;
            reportSize();
          });
        }

        function acceptPayload(data) {
          if (
            !data ||
            (data.widget !== "check" && data.widget !== "review" && data.widget !== "session-end")
          )
            return;
          if (typeof data.itemId !== "string" || data.itemId === "") return;
          var itemId = data.itemId;
          payload = data;
          states = [];
          position = 0;
          finished = false;
          draft = { text: "", choice: null, confidence: null };
          errorText = null;
          lastRetry = null;
          notice = null;
          doneAction = null;
          render();
          invoke("learn_widget_state", { itemId: itemId }, function (state) {
            if (!payload || payload.itemId !== itemId) return;
            states = Array.isArray(state.states) ? state.states : [];
            position =
              typeof state.position === "number" && state.position >= 0
                ? Math.floor(state.position)
                : 0;
            if (payload.widget === "review") {
              var cards = payload.cards || [];
              var n = cards.length;
              if (
                n > 0 &&
                states.slice(0, n).length === n &&
                states.slice(0, n).every(function (entry) {
                  return entry && entry.status === "graded";
                })
              ) {
                finished = true;
                position = n - 1;
              } else if (n > 0 && position >= n) position = n - 1;
            }
            syncDraft();
          });
        }

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || typeof data !== "object" || data.jsonrpc !== "2.0") return;
          if (typeof data.method === "string") {
            var params = data.params && typeof data.params === "object" ? data.params : {};
            if (data.id != null) {
              if (data.method === "ping" || data.method === "ui/resource-teardown") {
                post({ jsonrpc: "2.0", id: data.id, result: {} });
              }
              return;
            }
            if (data.method === "ui/notifications/tool-input") return;
            if (data.method === "ui/notifications/host-context-changed") {
              applyContext(params);
              return;
            }
            if (data.method === "ui/notifications/tool-result") {
              try {
                acceptPayload(unwrapTool(params));
              } catch (e) {
                /* ignore a failed delivery */
              }
            }
            return;
          }
          if (data.id != null && pending.has(data.id)) {
            var waiter = pending.get(data.id);
            pending.delete(data.id);
            if (data.error)
              waiter.reject(new Error((data.error && data.error.message) || "Request failed."));
            else waiter.resolve(data.result);
          }
        });

        if (typeof ResizeObserver === "function") {
          var observer = new ResizeObserver(function () {
            reportSize();
          });
          observer.observe(document.documentElement);
          if (document.body) observer.observe(document.body);
        }

        request("ui/initialize", {
          protocolVersion: PROTOCOL,
          appInfo: { name: "learn-widget", version: "1" },
          appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        }).then(
          function (result) {
            if (result && result.hostContext) applyContext(result.hostContext);
            notify("ui/notifications/initialized", {});
          },
          function () {
            errorText = "The host did not initialize.";
            render();
          },
        );
      })();
    </script>
  </body>
</html>
