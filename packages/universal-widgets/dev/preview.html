<!doctype html>
<html lang="en" data-theme="dark">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn widget preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --column: #101013;
        --fg: #f4f4f5;
        --mf: #a1a1aa;
        --border: rgba(255, 255, 255, 0.1);
        --card: #18181b;
        --accent: #818cf8;
        --accent-fg: #0b1020;
        --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.7);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #ececee;
        --column: #f7f7f8;
        --fg: #18181b;
        --mf: #71717a;
        --border: #e4e4e7;
        --card: #ffffff;
        --accent: #4f46e5;
        --accent-fg: #ffffff;
        --shadow: 0 18px 40px -24px rgba(24, 24, 27, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(
            900px 420px at 50% -10%,
            color-mix(in srgb, var(--accent) 16%, transparent),
            transparent 70%
          ),
          var(--bg);
        color: var(--fg);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
        padding: 22px 0 14px;
      }
      .brand {
        font-size: 15px;
        letter-spacing: -0.03em;
      }
      .brand b {
        font-weight: 800;
      }
      .brand span {
        color: var(--mf);
        font-weight: 500;
      }
      .seg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 3px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--fg) 6%, transparent);
      }
      .seg button,
      .tools button {
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .seg button {
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        color: var(--mf);
        font-size: 13px;
        font-weight: 500;
      }
      .seg button[aria-pressed="true"] {
        background: var(--card);
        color: var(--fg);
        box-shadow:
          0 0 0 1px var(--border),
          0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .tools {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      .tools button {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        box-shadow: 0 0 0 1px var(--border);
        background: var(--card);
        font-size: 13px;
        font-weight: 500;
      }
      .stage {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto 40px;
      }
      .thread {
        width: min(680px, 100%);
        margin: 8px auto 0;
        padding: 22px 22px 18px;
        border-radius: 18px;
        background: var(--column);
        box-shadow:
          var(--shadow),
          0 0 0 1px var(--border);
      }
      :root[data-phone="1"] .thread {
        width: min(390px, 100%);
        border-radius: 28px;
        padding: 18px 14px 14px;
      }
      .lead {
        margin: 0 0 14px;
        color: var(--mf);
        font-size: 13.5px;
      }
      .lead b {
        color: var(--fg);
        font-weight: 600;
      }
      iframe {
        display: block;
        width: 100%;
        height: 180px;
        border: 0;
        background: transparent;
      }
      .foot {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        color: var(--mf);
        font-size: 12px;
      }
      .trace {
        margin-left: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (max-width: 720px) {
        .top {
          flex-wrap: wrap;
        }
        .tools {
          margin-left: 0;
        }
        .trace {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand"><b>T3</b> <span>Learn</span></div>
      <div class="seg" role="tablist" aria-label="Widget">
        <button type="button" data-kind="check" role="tab">Check</button>
        <button type="button" data-kind="review" role="tab">Review</button>
        <button type="button" data-kind="session-end" role="tab">Session end</button>
      </div>
      <div class="tools">
        <button type="button" id="phone">Phone</button>
        <button type="button" id="theme">Light</button>
      </div>
    </header>
    <main class="stage">
      <section class="thread">
        <p class="lead" id="lead"></p>

          id="frame"
          sandbox="allow-scripts"

        }

        function send(message) {
          if (frame.contentWindow) frame.contentWindow.postMessage(message, "*");
        }

        function payload() {
          return payloads[kind];
        }

        function cardCount(body) {
          if (body.widget === "check") return 1;
          if (body.widget === "review") return body.cards.length;
          return 0;
        }

        function cardAt(body, index) {
          if (body.widget === "check") return index === 0 ? body.card : null;
          if (body.widget === "review") return body.cards[index] || null;
          return null;
        }

        function bucket(itemId, count) {
          if (!store[itemId]) store[itemId] = { states: [], position: 0 };
          var row = store[itemId];
          while (row.states.length < count) row.states.push({ status: "open", help: "none" });
          return row;
        }

        function ok(data) {
          return {
            content: [{ type: "text", text: JSON.stringify(data) }],
            structuredContent: data,
          };
        }

        function fail(message) {
          return { content: [{ type: "text", text: message }], isError: true };
        }

        function intervals() {
          return { again: "in 1 min", hard: "in 8 min", good: "in 3 days", easy: "in 9 days" };
        }

        function grade(args, card, help) {
          var answer = args.answer || {};
          var blob =
            typeof answer.choice === "number" && card.options
              ? String(card.options[answer.choice] || "")
              : String(answer.text || "");
          var correct = blob.toLowerCase().indexOf("fixed") !== -1;
          var outcome = help === "answer" ? "incorrect" : correct ? "correct" : "partial";
          var confidence =
            args.confidence === "high" || args.confidence === "medium" || args.confidence === "low"
              ? args.confidence
              : "low";
          var rating = "again";
          if (help !== "answer" && outcome === "correct" && confidence === "high") rating = "easy";
          else if (help !== "answer" && outcome === "correct" && confidence === "medium")
            rating = "good";
          else if (help !== "answer" && outcome === "correct") rating = "hard";
          else if (help !== "answer" && confidence === "high") rating = "hard";
          var right = "How expected the data is when θ is held fixed.";
          if (card.options) {
            card.options.forEach(function (option) {
              if (String(option).toLowerCase().indexOf("fixed") !== -1) right = option;
            });
          }
          var result = {
            outcome: outcome,
            rating: rating,
            hypercorrection: help !== "answer" && outcome !== "correct" && confidence === "high",
            feedback:
              help === "answer"
                ? "Shown. This one comes back soon."
                : outcome === "correct"
                  ? "That holds the data fixed and lets θ vary."
                  : "Part of it. The likelihood scores θ against data held fixed.",
            explanation: "L(θ) = P(data | θ). It is not a probability distribution over θ.",
            intervals: intervals(),
          };
          if (!(outcome === "correct" && help !== "answer")) result.correctAnswer = right;
          return {
            status: "graded",
            help: help,
            answer: answer,
            confidence: confidence,
            result: result,
          };
        }

        function handleTool(params) {
          var name = params.name;
          var args = params.arguments || {};
          var body = payload();
          var row = bucket(body.itemId, cardCount(body));
          if (args.itemId && args.itemId !== body.itemId) return fail("Unknown item.");
          if (name === "learn_widget_state") {
            document.getElementById("trace").textContent = "learn_widget_state";
            return ok({ states: row.states, position: row.position });
          }
          if (name === "learn_widget_hint") {
            var hinted = row.states[args.cardIndex] || { status: "open", help: "none" };
            hinted.help = "hint";
            hinted.hint = "Hold the data fixed, and let θ vary.";
            row.states[args.cardIndex] = hinted;
            document.getElementById("trace").textContent = "learn_widget_hint";
            return { content: [{ type: "text", text: JSON.stringify({ hint: hinted.hint }) }] };
          }
          if (name === "learn_widget_answer" || name === "learn_widget_reveal") {
            var card = cardAt(body, args.cardIndex);
            if (!card) return fail("Unknown card.");
            var help =
              name === "learn_widget_reveal" ? "answer" : args.help === "hint" ? "hint" : "none";
            var graded = grade(args, card, help);
            row.states[args.cardIndex] = graded;
            document.getElementById("trace").textContent =
              name + " → " + graded.result.outcome + ", " + graded.result.rating;
            return ok(graded);
          }
          if (name === "learn_widget_override") {
            var current = row.states[args.cardIndex];
            if (!current || !current.result) return fail("Grade the card first.");
            if (["again", "hard", "good", "easy"].indexOf(args.rating) === -1)
              return fail("Unknown rating.");
            var next = JSON.parse(JSON.stringify(current));
            next.result.rating = args.rating;
            next.result.overridden = true;
            row.states[args.cardIndex] = next;
            document.getElementById("trace").textContent = "learn_widget_override → " + args.rating;
            return ok(next);
          }
          if (name === "learn_widget_action") {
            var message =
              args.action === "snooze"
                ? "Snoozed until " + ((body.summary && body.summary.snoozeUntil) || "later") + "."
                : args.action === "start_concept"
                  ? "Opening " + (args.conceptId || "the concept") + "."
                  : args.action === "continue"
                    ? "Continuing."
                    : "";
            if (!message) return fail("Unknown action.");
            document.getElementById("trace").textContent = "learn_widget_action " + args.action;
            return ok({ ok: true, message: message });
          }
          return fail("Unknown tool.");
        }

        function deliver() {
          var body = payload();
          store[body.itemId] = { states: [], position: 0 };
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-input",
            params: { arguments: { answerKey: "fixed", correctChoice: 0 } },
          });
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-result",
            params: {
              content: [{ type: "text", text: JSON.stringify(body) }],
              structuredContent: body,
            },
          });
          document.getElementById("trace").textContent = "tool-result " + body.widget;
        }

        window.addEventListener("message", function (event) {
          if (event.source !== frame.contentWindow) return;
          var msg = event.data;
          if (!msg || msg.jsonrpc !== "2.0") return;
          if (msg.method === "ui/initialize" && msg.id != null) {
            booted = false;
            var requested = msg.params && msg.params.protocolVersion;
            send({
              jsonrpc: "2.0",
              id: msg.id,
              result: {
                protocolVersion: requested === PROTOCOL ? requested : PROTOCOL,
                hostInfo: { name: "t3-code", version: "preview" },
                hostCapabilities: {
                  openLinks: {},
                  serverTools: {},
                  serverResources: {},
                  logging: {},
                  message: { text: {} },
                  updateModelContext: { text: {}, structuredContent: {} },
                  downloadFile: {},
                  sandbox: {},
                },
                hostContext: context(),
              },
            });
            return;
          }
          if (msg.method === "ui/notifications/initialized") {
            if (booted) return;
            booted = true;
            deliver();
            return;
          }
          if (msg.method === "ui/notifications/size-changed") {
            var height = msg.params && msg.params.height;
            if (typeof height === "number" && isFinite(height)) {
              frame.style.height = Math.max(48, Math.ceil(height)) + "px";
            }
            return;
          }
          if (msg.method === "tools/call" && msg.id != null) {
            try {
              send({ jsonrpc: "2.0", id: msg.id, result: handleTool(msg.params || {}) });
            } catch (err) {
              send({
                jsonrpc: "2.0",
                id: msg.id,
                error: {
                  code: -32000,
                  message: err && err.message ? err.message : "Request failed.",
                },
              });
            }
            return;
          }
          if (msg.method === "ping" && msg.id != null)
            send({ jsonrpc: "2.0", id: msg.id, result: {} });
        });

        function paint() {
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.phone = phone ? "1" : "0";
          document.getElementById("lead").innerHTML = leads[kind];
          document.getElementById("hint").textContent =
            "Answers containing “fixed” grade correct. Anything else is partial.";
          document.getElementById("theme").textContent = theme === "dark" ? "Light" : "Dark";
          document.getElementById("phone").textContent = phone ? "Thread" : "Phone";
          document.getElementById("phone").setAttribute("aria-pressed", phone ? "true" : "false");
          document.querySelectorAll(".seg button").forEach(function (button) {
            button.setAttribute(
              "aria-pressed",
              button.getAttribute("data-kind") === kind ? "true" : "false",
            );
          });
        }

        function pushContext() {
          paint();
          if (!booted) return;
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/host-context-changed",
            params: {
              theme: theme,
              styles: { variables: variables() },
              containerDimensions: dimensions(),
              platform: phone ? "mobile" : "web",
            },
          });
        }

        // Captured before reload mutates it. Inlined srcdoc still works from a file:// page.
        var widgetHtml = frame.getAttribute("srcdoc") || "";

        function reload() {
          booted = false;
          frame.style.height = "160px";
          generation += 1;
          if (widgetHtml.indexOf("<body") !== -1) {
            frame.removeAttribute("src");
            frame.srcdoc = widgetHtml.replace(
              "</body>",
              "<!-- preview " + generation + " --></body>",
            );
            return;
          }
          frame.src = "../src/learn-widget.html?preview=" + generation;
        }

        document.querySelectorAll(".seg button").forEach(function (button) {
          button.addEventListener("click", function () {
            kind = button.getAttribute("data-kind");
            paint();
            reload();
          });
        });
        document.getElementById("theme").addEventListener("click", function () {
          theme = theme === "dark" ? "light" : "dark";
          pushContext();
        });
        document.getElementById("phone").addEventListener("click", function () {
          phone = !phone;
          pushContext();
        });

        paint();
        reload();
      })();
    </script>
  </body>
</html>
